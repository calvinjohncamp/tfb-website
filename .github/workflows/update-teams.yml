name: Mannschaften aus nuLiga aktualisieren

on:
  schedule:
    - cron: '0 4 * * 1'      # jeden Montag 04:00 UTC = 6 Uhr (Sommerzeit) bzw. 5 Uhr (Winterzeit)
  workflow_dispatch:          # zusätzlich per Knopf in GitHub startbar

permissions:
  contents: write             # darf die neue teams.js ins Repo speichern

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/update-teams.py
      - name: Änderung speichern (nur wenn sich etwas geändert hat)
        run: |
          git config user.name  "TFB-Abgleich"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/teams.js
          if git diff --cached --quiet; then
            echo "Keine Änderung bei nuLiga."
          else
            git commit -m "data: Mannschaften aus nuLiga aktualisiert"
            git push
          fi
