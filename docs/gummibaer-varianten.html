<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gummibär-Varianten</title>
  <style>
    :root { --ink: #1C2520; --muted: #6A7069; --bg: #FBFBF8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px 16px 48px; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { font-family: "Iowan Old Style", Georgia, serif; font-size: 1.8rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 18px; box-shadow: 0 0 0 1px #ECE8E0, 0 6px 18px rgba(28,37,32,.06); padding: 16px; }
    .card h2 { font-size: 1.05rem; margin: 0 0 2px; }
    .card p { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
    .big { display: grid; place-items: center; border-radius: 14px; height: 210px; background: #F7EED6; }
    .big .art { width: 190px; height: 190px; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .row div { display: grid; place-items: center; border-radius: 12px; height: 86px; }
    .row .art { width: 62px; height: 62px; }
    .art { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Gummibär – fünf Varianten</h1>
    <p class="lead">Jeweils groß und darunter in Kachelgröße in Grün, Gold und Rot. Sag mir einfach die Nummer.</p>
    <div class="grid" id="grid"></div>
  </main>
  <script>window.TFB = {};</script>
  <script src="../assets/js/art.js"></script>
  <script>
    const variants = [
      ['bear', '1 · Silhouette', 'Eine durchgehende Kontur: flache Ohr-Noppen, leichte Halskerbe, stumpfe Füße.'],
      ['bear2', '2 · Relief', 'Wie 1, dazu Schnäuzchen, Bauch und Ärmchen als feine Prägung – wie beim echten Bärchen.'],
      ['bear3', '3 · Block', 'Kantiger Indie-Stempel aus abgerundeten Rechtecken.'],
      ['bear4', '4 · Trio', 'Drei Bärchen wie in der Tüte: grün, gold, rot.'],
      ['bear5', '5 · Glanz', 'Wie 1, mit einer hellen Lichtkante für das Durchscheinende.'],
    ];
    const tints = ['#E7EFD9', '#F7EED6', '#F8DCDC'];
    const colors = ['#6E9E2E', '#E8B22B', '#D2202F'];
    document.getElementById('grid').innerHTML = variants.map(([kind, title, text]) => `
      <section class="card">
        <h2>${title}</h2>
        <p>${text}</p>
        <div class="big">${TFB.art(kind, '#E8B22B')}</div>
        <div class="row">${colors.map((c, i) => `<div style="background:${tints[i]}">${TFB.art(kind, c)}</div>`).join('')}</div>
      </section>`).join('');
  </script>
</body>
</html>
